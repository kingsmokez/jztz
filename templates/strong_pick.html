<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短线强势股</title>
    <link rel="stylesheet" href="/static/design-system.css">
    <style>
        /* ===== 页面特有样式（共享 token/组件由 design-system.css 提供） ===== */

        /* 统计行 */
        .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 12px 15px; position: relative; overflow: hidden;
        }
        .stat-box::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--border-2); }
        .stat-box.accent::before { background: var(--accent); }
        .stat-box .val { font-size: 23px; font-weight: 800; color: var(--text); font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1.2; }
        .stat-box .val.gold { color: var(--accent); }
        .stat-box .val.green { color: var(--down); }
        .stat-box .lbl { font-size: 12px; color: var(--text-3); margin-top: 3px; }

        /* 股票表格 */
        .stock-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: visible; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
        .panel-header h3 { font-size: 13px; font-weight: 700; color: var(--text-2); letter-spacing: .5px; }
        .panel-header .time { font-size: 12px; color: var(--text-3); font-family: var(--mono); }
        .table-wrap { display: block; overflow: visible; max-height: none; }
        .stock-table { width: 100%; border-spacing: 0; font-variant-numeric: tabular-nums; }
        .stock-table thead th {
            position: sticky; top: calc(var(--nav-h) - 1px); z-index: 5;
            background: var(--surface-2); padding: 10px 12px; text-align: right;
            font-size: 12px; font-weight: 600; color: var(--text-3);
            border-bottom: 1px solid var(--border-2);
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .stock-table thead th:first-child,
        .stock-table thead th:nth-child(2),
        .stock-table thead th:nth-child(12) { text-align: left; }
        .stock-table thead th[onclick]:hover { color: var(--text); }
        .stock-table thead th[onclick] { transition: color .12s; }
        .stock-table td {
            padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.045);
            font-size: 13px; text-align: right; white-space: nowrap; font-family: var(--mono);
        }
        .stock-table tbody tr:hover { background: rgba(231,178,58,0.05); }
        .stock-table tbody tr:last-child td { border-bottom: none; }
        .stock-link { text-decoration: none; color: inherit; display: block; text-align: left; }
        .stock-link:hover .name-cell { color: var(--accent); }
        .name-cell { font-weight: 700; color: var(--text); font-size: 13px; font-family: var(--sans); }
        .code-cell { font-size: 11px; color: var(--text-3); margin-top: 1px; font-family: var(--mono); }

        .score-val { font-weight: 800; font-size: 14px; font-family: var(--mono); }
        .score-high { color: var(--accent); }
        .score-mid { color: #cd9a4a; }
        .score-low { color: var(--text-3); }

        .skeleton-row td { padding: 10px 12px; }

        @media (max-width: 900px) {
            .container { padding: 16px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .table-wrap { max-height: none; }
            .strategy-bar { gap: 8px; }
        }
    </style>
    <script src="/api/js/common.js"></script>
</head>
<body>
    <nav class="app-nav">
        <div class="brand">
            <div class="logo">势</div>
            <span>强势股</span>
        </div>
        <div class="links">
            <a class="link" href="/">首页</a>
            <a class="link" href="/daily_pick">中短线</a>
            <a class="link" href="/auction_compare">竞价</a>
            <a class="link active" href="/strong_pick">强势股</a>
            <a class="link" href="/wp2_pick">尾盘</a>
        </div>
        <div class="nav-time" id="navTime"></div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>短线强势股 <span class="tag">实时扫描 · 全市场</span></h1>
                <div class="sub">突破 / 动量 / 回调企稳 三因子共振筛选</div>
            </div>
            <div class="actions">
                <button class="btn btn-primary" id="pickBtn" onclick="executePick()">执行筛选</button>
                <button class="btn btn-ghost" onclick="clearCache()">清除缓存</button>
                <button class="btn btn-ghost" onclick="location.reload()">刷新</button>
            </div>
        </div>

        <!-- 涨停回调企稳策略（一行精简） -->
        <div class="strategy">
            <span class="label">涨停回调企稳</span>
            <span class="step">近5日<b>涨停</b>主力确认</span><span class="sep">→</span>
            <span class="step">回调<b>&lt;50%</b></span><span class="sep">→</span>
            <span class="step">缩量企稳 <b>&lt;涨停日80%</b></span><span class="sep">→</span>
            <span class="step">二次放量<b>介入</b></span>
        </div>

        <!-- 筛选条件 -->
        <div class="filter-bar">
            <div class="filter-tag"><b>突破</b> 近20/60日高点</div>
            <div class="filter-tag"><b>动量</b> 5日+3% · 3日+2%</div>
            <div class="filter-tag"><b>量能</b> 3日均&gt;10日×1.3</div>
            <div class="filter-tag"><b>趋势</b> 价&gt;MA5&gt;MA10</div>
            <div class="filter-tag"><b>涨停</b> 近20日涨停回调+15</div>
        </div>

        <!-- 统计 -->
        <div class="stats-row" id="statsRow">
            <div class="stat-box accent">
                <div class="val" id="totalCount">-</div>
                <div class="lbl">强势股</div>
            </div>
            <div class="stat-box">
                <div class="val" id="avgChange">-</div>
                <div class="lbl">平均涨幅</div>
            </div>
            <div class="stat-box">
                <div class="val" id="avgScore">-</div>
                <div class="lbl">平均评分</div>
            </div>
            <div class="stat-box">
                <div class="val gold" id="goldenCrossCount">-</div>
                <div class="lbl">金叉信号</div>
            </div>
            <div class="stat-box">
                <div class="val" id="pullbackCount">-</div>
                <div class="lbl">回调企稳</div>
            </div>
        </div>

        <!-- 股票列表 -->
        <div class="stock-panel">
            <div class="panel-header">
                <h3>筛选结果</h3>
                <div class="time" id="pickTime"></div>
            </div>
            <div class="table-wrap">
                <div id="stocksContent">
                    <div class="empty-state">
                        <div class="icon">势</div>
                        <div class="title">等待筛选</div>
                        <div class="desc">点击「执行筛选」扫描全市场强势股</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-tip" id="updateTime"></div>
    </div>

    <script src="/static/design-system.js"></script>
    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('navTime').textContent = now.toLocaleTimeString('zh-CN', {hour12: false});
        }
        updateTime();
        setInterval(updateTime, 1000);

        window.onload = function() { fetchStocks(true); };

        let _strongPollTimer = null;

        function startStrongPoll(reason = '选股中') {
            if (_strongPollTimer) clearInterval(_strongPollTimer);
            showSkeleton(12);
            document.getElementById('pickTime').textContent = '正在扫描全市场...';
            let attempts = 0;
            _strongPollTimer = setInterval(async () => {
                attempts++;
                if (attempts > 150) {
                    clearInterval(_strongPollTimer);
                    showToast('扫描仍在进行，请稍后点击刷新查看结果', 'warning');
                    document.getElementById('pickBtn').disabled = false;
                    document.getElementById('pickBtn').textContent = '执行筛选';
                    return;
                }
                try {
                    const resp = await fetch('/api/strong_pick?t=' + Date.now());
                    const data = await resp.json();
                    if (data.success && data.stocks && data.stocks.length > 0) {
                        clearInterval(_strongPollTimer);
                        renderStocks(data);
                        showToast('强势股数据已更新', 'success');
                        document.getElementById('pickBtn').disabled = false;
                        document.getElementById('pickBtn').textContent = '执行筛选';
                    }
                } catch (e) {}
            }, 2000);
        }

        async function fetchStocks(autoRunIfEmpty = false) {
            try {
                const resp = await fetch('/api/strong_pick');
                const data = await resp.json();
                if (data.success && data.stocks && data.stocks.length > 0) {
                    const today = new Date().toISOString().slice(0, 10);
                    const isToday = data.date === today;
                    renderStocks(data);
                    if (autoRunIfEmpty && !isToday) {
                        executePick(true);
                    }
                } else if (autoRunIfEmpty) {
                    executePick(true);
                } else {
                    showEmpty();
                }
            } catch (e) {
                console.error('获取数据失败:', e);
                showEmpty();
            }
        }

        async function executePick(silent = false) {
            const btn = document.getElementById('pickBtn');
            btn.disabled = true;
            btn.textContent = '筛选中...';
            if (!silent) {
                showSkeleton(12);
            }

            let startedPoll = false;
            try {
                const resp = await fetchWithCSRF('/api/strong_pick_execute', {
                    method: 'POST',
                });
                const data = await resp.json();
                if (data.success && data.stocks && data.stocks.length > 0) {
                    renderStocks(data);
                    if (!silent) showToast('选股已启动，数据已更新');
                } else {
                    startStrongPoll(silent ? '缓存过期，正在重新选股' : '正在选股');
                    startedPoll = true;
                }
            } catch (e) {
                showToast('请求异常，显示已有数据');
                await fetchStocks(false);
            } finally {
                if (!startedPoll) {
                    btn.disabled = false;
                    btn.textContent = '执行筛选';
                }
            }
        }

        async function clearCache() {
            try {
                await fetchWithCSRF('/api/strong_pick_clear', {
                    method: 'DELETE',
                });
                showToast('缓存已清除');
                showEmpty();
            } catch (e) { showToast('清除失败'); }
        }

        let _lastData = null;
        let _sort = { key: null, dir: -1 };
        let _priceCache = null;
        let _refreshTimer = null;

        const _COLUMNS = [
            { k: null,    label: '#' },
            { k: 'name',  label: '股票', left: true },
            { k: 'price', label: '股价' },
            { k: 'change_pct', label: '今涨' },
            { k: 'change_5d',  label: '5日' },
            { k: 'breakthrough_pct', label: '突破' },
            { k: 'position_pct', label: '布林位' },
            { k: 'volume_ratio', label: '量比' },
            { k: 'turnover_rate', label: '换手' },
            { k: 'rsi', label: 'RSI' },
            { k: 'score', label: '评分' },
            { k: null, label: '信号', left: true },
            { k: null, label: '买入价' },
            { k: null, label: '卖出价' },
            { k: null, label: '止损价' },
        ];

        function buildHeadHtml() {
            let head = '<tr>';
            for (const c of _COLUMNS) {
                if (c.k) {
                    const active = _sort.key === c.k;
                    const arrow = active ? (_sort.dir === 1 ? ' ▲' : ' ▼') : '';
                    const style = 'cursor:pointer;user-select:none;'
                        + (active ? 'color:var(--accent);' : '')
                        + (c.left ? 'text-align:left;' : '');
                    head += `<th onclick="sortBy('${c.k}')" style="${style}" aria-sort="${active ? (_sort.dir === 1 ? 'ascending' : 'descending') : 'none'}">${c.label}${arrow}</th>`;
                } else {
                    head += `<th${c.left ? ' style="text-align:left;"' : ''}>${c.label}</th>`;
                }
            }
            head += '</tr>';
            return head;
        }

        function sortBy(key) {
            if (_sort.key === key) _sort.dir *= -1;
            else { _sort.key = key; _sort.dir = (key === 'name') ? 1 : -1; }
            if (_lastData) renderStocks(_lastData);
        }

        function showSkeleton(n = 12) {
            const widths = [20, 96, 56, 48, 48, 48, 48, 48, 48, 44, 36, 120, 56, 56, 56];
            let rows = '';
            for (let i = 0; i < n; i++) {
                rows += '<tr class="skeleton-row">';
                for (const w of widths) rows += `<td><div class="sk-bar" style="width:${w}px"></div></td>`;
                rows += '</tr>';
            }
            document.getElementById('stocksContent').innerHTML =
                '<table class="stock-table"><thead>' + buildHeadHtml() + '</thead><tbody>' + rows + '</tbody></table>';
        }

        function renderStocks(data) {
            _lastData = data;
            let stocks = (data.stocks || []).slice();

            if (_sort.key) {
                const key = _sort.key, dir = _sort.dir;
                stocks.sort((a, b) => {
                    if (key === 'name') return a.name.localeCompare(b.name, 'zh') * dir;
                    const va = (a[key] == null ? -Infinity : a[key]);
                    const vb = (b[key] == null ? -Infinity : b[key]);
                    return (va - vb) * dir;
                });
            }

            const avgChange = stocks.length > 0
                ? (stocks.reduce((s, x) => s + x.change_pct, 0) / stocks.length).toFixed(2)
                : 0;
            const avgScore = stocks.length > 0
                ? (stocks.reduce((s, x) => s + x.score, 0) / stocks.length).toFixed(1)
                : 0;
            const gcCount = stocks.filter(s => s.golden_cross).length;
            const pbCount = stocks.filter(s => s.pullback_stable).length;

            if (window.FX) {
                FX.countUp(document.getElementById('totalCount'), stocks.length);
                FX.countUp(document.getElementById('avgChange'), parseFloat(avgChange) || 0, {suffix: '%', decimals: 2});
                FX.countUp(document.getElementById('avgScore'), parseFloat(avgScore) || 0, {decimals: 1});
                FX.countUp(document.getElementById('goldenCrossCount'), gcCount);
                FX.countUp(document.getElementById('pullbackCount'), pbCount);
            } else {
                document.getElementById('totalCount').textContent = stocks.length;
                document.getElementById('avgChange').textContent = (avgChange || 0) + '%';
                document.getElementById('avgScore').textContent = avgScore || 0;
                document.getElementById('goldenCrossCount').textContent = gcCount;
                document.getElementById('pullbackCount').textContent = pbCount;
            }

            document.getElementById('pickTime').textContent = data.pick_time ? '筛选时间 ' + data.pick_time : '';
            document.getElementById('updateTime').textContent = data.last_update ? '更新于 ' + data.last_update : '';

            let html = '<table class="stock-table"><thead>' + buildHeadHtml() + '</thead><tbody>';

            for (let i = 0; i < stocks.length; i++) {
                const s = stocks[i];
                const sc = s.score >= 70 ? 'score-high' : s.score >= 50 ? 'score-mid' : 'score-low';

                let tags = '';
                if (s.pullback_stable) tags += '<span class="sig sig-pullback">回调企稳</span> ';
                if (s.has_limit_up && !s.pullback_stable) tags += '<span class="sig sig-limit">涨停</span>';
                if (s.breakthrough_pct >= 0) tags += '<span class="sig sig-break">突破</span>';
                if (s.golden_cross) tags += '<span class="sig sig-cross">金叉</span>';
                if (s.gentle_volume) tags += '<span class="sig sig-gentle">温和放量</span>';
                if (s.moderate_volume) tags += '<span class="sig sig-moderate">明显放量</span>';
                if (s.extreme_volume) tags += '<span class="sig sig-extreme">极端放量</span>';
                if (s.change_5d >= 10) tags += '<span class="sig sig-strong">强势</span>';
                if ((s.position_pct >= 90 && s.change_pct >= 7) || s.change_pct >= 9) tags += '<span class="sig sig-risk">追高风险</span>';

                let rsiStyle = '';
                if (s.rsi != null) {
                    if (s.rsi > 75) rsiStyle = 'color:var(--up);';
                    else if (s.rsi >= 60) rsiStyle = 'color:#cd9a4a;';
                }

                let mkt = s.code.startsWith('6') ? 'sh' : 'sz';
                let url = 'https://quote.eastmoney.com/' + mkt + s.code + '.html';
                let chgClass = s.change_pct >= 5 ? 'hot' : s.change_pct > 0 ? 'up' : s.change_pct < 0 ? 'down' : '';
                let chg5dClass = s.change_5d >= 5 ? 'hot' : s.change_5d > 0 ? 'up' : s.change_5d < 0 ? 'down' : '';
                let btHtml = s.breakthrough_pct >= 0 ? '<span class="up">' + s.breakthrough_pct + '%</span>' : '<span class="muted">' + s.breakthrough_pct + '%</span>';
                let industryHtml = s.industry ? ' · ' + s.industry : '';

                html += '<tr>';
                html += '<td style="color:var(--accent);font-weight:700;">' + (i+1) + '</td>';
                html += '<td><a href="' + url + '" target="_blank" rel="noopener" class="stock-link"><div class="name-cell">' + s.name + '</div><div class="code-cell">' + s.code + industryHtml + '</div></a></td>';
                html += '<td class="' + chgClass + '" data-col="price" data-val="' + (s.price || '0') + '" data-code="' + s.code + '">' + (s.price != null && s.price !== 0 ? s.price.toFixed(2) : '-') + '</td>';
                html += '<td class="' + chgClass + '">' + s.change_pct + '%</td>';
                html += '<td class="' + chg5dClass + '">' + s.change_5d + '%</td>';
                html += '<td>' + btHtml + '</td>';
                html += '<td>' + s.position_pct + '%</td>';
                html += '<td class="' + (s.volume_ratio >= 2 ? 'up' : '') + '">' + s.volume_ratio + '</td>';
                html += '<td>' + (s.turnover_rate ? s.turnover_rate + '%' : '-') + '</td>';
                html += '<td style="' + rsiStyle + '">' + (s.rsi != null ? s.rsi : '-') + '</td>';
                html += '<td><span class="score-val ' + sc + '">' + s.score + '</span></td>';
                html += '<td style="text-align:left;">' + (tags || '<span class="muted">-</span>') + '</td>';
                html += '<td>' + (s.buy_sell ? s.buy_sell.buy.toFixed(2) : '-') + '</td>';
                html += '<td>' + (s.buy_sell ? s.buy_sell.sell.toFixed(2) : '-') + '</td>';
                html += '<td>' + (s.buy_sell ? s.buy_sell.stop_loss.toFixed(2) : '-') + '</td>';
                html += '</tr>';
            }

            html += '</tbody></table>';
            document.getElementById('stocksContent').innerHTML = html;

            // 实时价格跳动闪烁
            if (window.FX && _priceCache) {
                document.querySelectorAll('#stocksContent td[data-col="price"]').forEach(function(td) {
                    var c = td.dataset.code;
                    if (c && _priceCache[c] != null && _priceCache[c] !== td.dataset.val) {
                        FX.flash(td, parseFloat(td.dataset.val) > parseFloat(_priceCache[c]) ? 1 : -1);
                    }
                    _priceCache[c] = td.dataset.val;
                });
            } else if (window.FX) {
                _priceCache = {};
                document.querySelectorAll('#stocksContent td[data-col="price"]').forEach(function(td) {
                    _priceCache[td.dataset.code] = td.dataset.val;
                });
            }

            // 自动刷新（首次渲染后每 30 秒拉一次实时行情，价格变化会闪烁）
            if (!_refreshTimer && stocks.length > 0 && window.FX) {
                _refreshTimer = setInterval(async function() {
                    try {
                        var r = await fetch('/api/strong_pick?t=' + Date.now());
                        var d = await r.json();
                        if (d.success && d.stocks && d.stocks.length > 0) renderStocks(d);
                    } catch(e) {}
                }, 30000);
            }
        }

        function showEmpty() {
            document.getElementById('stocksContent').innerHTML = '<div class="empty-state"><div class="icon">势</div><div class="title">等待筛选</div><div class="desc">点击「执行筛选」扫描全市场强势股</div></div>';
            ['totalCount','avgChange','avgScore','goldenCrossCount','pullbackCount'].forEach(id => {
                document.getElementById(id).textContent = '-';
            });
            document.getElementById('pickTime').textContent = '';
            document.getElementById('updateTime').textContent = '';
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = 'position:fixed;top:62px;left:50%;transform:translateX(-50%);padding:9px 22px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);border-radius:6px;font-size:13px;z-index:9999;font-family:var(--sans);';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }
    </script>
</body>
</html>
